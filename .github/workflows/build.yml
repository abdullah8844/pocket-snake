name: Build iPhone IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build unsigned app
        run: bash build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: PocketSnake-IPA
          path: build/PocketSnake-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
